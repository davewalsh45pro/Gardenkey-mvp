<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GardenKey Seedling Tracker</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f7f1e5;color:#123c2d}.wrap{max-width:780px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;margin-bottom:10px}.top a{font-weight:900;color:#123c2d;text-decoration:none}.hero,.card{background:#fffaf1;border:1px solid #e2d7c4;border-radius:28px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #0001}.hero{background:linear-gradient(135deg,#dff0d2,#f5e7bd)}h1{font-size:40px;line-height:1;margin:10px 0}h2{margin-top:0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row2{grid-template-columns:1fr}}.field{margin:10px 0}label{display:block;font-weight:900;text-transform:uppercase;letter-spacing:.07em;font-size:12px;margin-bottom:5px}input,textarea,select{width:100%;font:inherit;font-size:15px;padding:12px;border-radius:14px;border:1px solid #d8cfbe;background:white;min-height:46px}textarea{min-height:76px;resize:vertical}.readonly{background:#f1eee6;color:#52635a}.btn{display:inline-block;background:#d9a63a;color:#222;border:0;border-radius:999px;padding:12px 17px;text-decoration:none;font-weight:900;margin:5px 4px 0 0;cursor:pointer}.btn.secondary{background:white;border:1px solid #d8cfbe}.status{font-size:13px;font-weight:800;margin:8px 0}.status.ok{color:#2f7a4f}.status.err{color:#b0432e}.saved{display:flex;flex-direction:column;gap:6px;margin-top:8px}.saved a{display:block;background:white;border:1px solid #e0d6c2;border-radius:14px;padding:10px 14px;text-decoration:none;color:inherit}.pill{background:white;border:1px solid #0001;font-weight:900;padding:6px 14px;border-radius:999px;display:inline-block;margin-bottom:8px}.small{font-size:13px;color:#65746a}</style></head><body><div class="wrap">
<div class="top"><a href="index.html">← GardenKey home</a><a href="myplants.html">My Plants</a></div>
<section class="hero"><span class="pill">GardenKey · PILOT V30.0.0</span><h1>Your Seedling Tracker</h1><p>Track propagation areas, trays and young plants as they germinate, root and grow on. Saved to this browser only.</p></section>
<section class="card"><div class="row2"><div class="field"><label>Seedling area ID</label><input id="seedId" class="readonly" readonly></div><div class="field"><label>Name</label><textarea id="seedName" rows="2"></textarea></div></div><button class="btn secondary" onclick="newSeedling()">New seedling area</button><div id="loadStatus" class="status"></div><div id="savedList" class="saved"></div></section>
<section class="card"><h2>Propagation details</h2><div class="row2"><div class="field"><label>Location</label><input id="location"></div><div class="field"><label>Light</label><input id="light"></div></div><div class="row2"><div class="field"><label>Soil / medium</label><textarea id="soil"></textarea></div><div class="field"><label>Watering</label><textarea id="water"></textarea></div></div><div class="field"><label>Plants, trays and progress notes</label><textarea id="notes"></textarea></div><button class="btn" onclick="saveSeedling()">Save to this browser</button></section>
</div><script>
const key=id=>'gk_seedling_'+id, indexKey='gk_seedling_index'; const val=id=>document.getElementById(id).value, setVal=(id,v)=>document.getElementById(id).value=v||'';
function getIndex(){try{return JSON.parse(localStorage.getItem(indexKey))||[]}catch(e){return[]}}
function renderSaved(){const a=getIndex();savedList.innerHTML=a.length?'<span class="small">Saved on this device:</span>'+a.map(x=>`<a href="?id=${encodeURIComponent(x.id)}">${x.name||x.id}</a>`).join(''):'<span class="small">No seedling areas saved on this device yet.</span>'}
function addIndex(id,name){let a=getIndex(),x=a.find(v=>v.id===id);if(x)x.name=name;else a.push({id,name});localStorage.setItem(indexKey,JSON.stringify(a));renderSaved()}
function collect(){return{id:val('seedId'),name:val('seedName'),location:val('location'),light:val('light'),soil:val('soil'),water:val('water'),notes:val('notes')}}
function fill(r){setVal('seedId',r.id);setVal('seedName',r.name);setVal('location',r.location);setVal('light',r.light);setVal('soil',r.soil);setVal('water',r.water);setVal('notes',r.notes)}
function saveSeedling(){const r=collect();if(!r.id||!r.name){alert('Give this seedling area a name first.');return}localStorage.setItem(key(r.id),JSON.stringify(r));addIndex(r.id,r.name);loadStatus.textContent='Currently loaded: '+r.name+' (saved)';loadStatus.className='status ok'}
function newSeedling(){fill({id:'GK-SEED-'+Date.now().toString().slice(-6),name:'',location:'',light:'',soil:'',water:'',notes:''});loadStatus.textContent='Started a new blank seedling area.';loadStatus.className='status'}
function loadSeedling(id){try{const r=JSON.parse(localStorage.getItem(key(id))||'null');if(r){fill(r);loadStatus.textContent='Currently loaded: '+r.name;loadStatus.className='status ok'}else{fill({id,name:'',location:'',light:'',soil:'',water:'',notes:''})}}catch(e){loadStatus.textContent='Could not load that seedling area.';loadStatus.className='status err'}}
async function importDraft(draftId){try{const res=await fetch('personal-drafts.json?v=300000',{cache:'no-store'});if(!res.ok)throw Error('Draft file unavailable');const d=(await res.json())[draftId];if(!d)throw Error('Draft not found');const id=d.collectionId||d.recordId||('GK-SEED-'+Date.now().toString().slice(-6));let r;try{r=JSON.parse(localStorage.getItem(key(id))||'null')}catch(e){}r=r||{id,name:'',location:'',light:'',soil:'',water:'',notes:''};Object.assign(r,{id,name:d.nickname||d.libraryName||'Propagation Area',location:d.location||r.location||'',light:d.light||r.light||'',soil:d.soil||r.soil||'',water:d.water||r.water||'',notes:d.notes||r.notes||'',sourceDraftId:draftId,testerId:d.testerId||'',testerName:d.testerName||''});localStorage.setItem(key(id),JSON.stringify(r));addIndex(id,r.name);fill(r);loadStatus.textContent='Welcome '+(d.testerName||'')+' — '+r.name+' is ready and saved on this device.';loadStatus.className='status ok';history.replaceState(null,'','seedling.html?id='+encodeURIComponent(id)+'&v=300000')}catch(e){loadStatus.textContent='Could not import propagation draft. '+e.message;loadStatus.className='status err'}}
const params=new URLSearchParams(location.search);if(params.get('draft'))importDraft(params.get('draft'));else if(params.get('id'))loadSeedling(params.get('id'));else newSeedling();renderSaved();
</script></body></html>
