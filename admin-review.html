<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GardenKey — Review submissions</title><style>body{font-family:system-ui;margin:0;background:#f7f1e5;color:#123c2d}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#fffaf1;border:1px solid #e2d7c4;border-radius:24px;padding:18px;margin:14px 0}.badge{display:inline-block;padding:5px 10px;border-radius:99px;background:#eee;font-weight:800}.matched{background:#dcefd8}.provisional{background:#fff0bf}.unmatched{background:#ffd9cf}a{color:inherit}.small{color:#65746a}</style></head><body><div class="wrap"><a href="index.html">← GardenKey home</a><h1>Review plant submissions</h1><p>Only provisional and unmatched repository records require action. User-entered nicknames and observations must never be overwritten.</p><div id="queue"></div></div><script>Promise.all([fetch('user-plants.json',{cache:'no-store'}).then(r=>r.json()),fetch('plants.json',{cache:'no-store'}).then(r=>r.json())]).then(([users,plants])=>{const rows=Object.values(users).filter(r=>r.matchStatus!=='matched');queue.innerHTML=rows.length?rows.map(r=>`<section class="card"><span class="badge ${r.matchStatus}">${r.matchStatus}</span><h2>${r.nickname||r.id}</h2><div class="small">${r.id}</div><p>Submitted plant: ${r.libraryName||'Not supplied'}</p><p><a href="myplant.html?id=${encodeURIComponent(r.id)}">Open record →</a></p></section>`).join(''):'<section class="card"><b>No records currently need review.</b><p>Dili’s Acidanthera entry is already matched to GK-ACI-001.</p></section>'}).catch(()=>queue.innerHTML='<section class="card">Could not load the repository files.</section>');</script></body></html>
